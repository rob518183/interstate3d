name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build and test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build-type: [Release]

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential cmake pkg-config git libgl1-mesa-dev libglfw3-dev libassimp-dev libbullet-dev libglm-dev

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew update
        brew install cmake pkg-config git glfw assimp bullet glm

    - name: Prepare Windows (vcpkg)
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        choco install -y cmake --installargs 'ADD_CMAKE_TO_PATH=System' --no-progress || Write-Host 'cmake may already be available'
        choco install -y git || Write-Host 'git may already be available'
        git clone https://github.com/microsoft/vcpkg.git vcpkg
        .\vcpkg\bootstrap-vcpkg.bat
        .\vcpkg\vcpkg.exe install glfw3:triplet=x64-windows assimp:triplet=x64-windows bullet3:triplet=x64-windows glm:triplet=x64-windows
        echo "VCPKG_ROOT=${{ github.workspace }}\\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Configure (Linux/macOS)
      if: runner.os != 'Windows'
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build-type }}

    - name: Configure (Windows)
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} -DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake

    - name: Build
      run: cmake --build build --config ${{ matrix.build-type }} -- -j

    - name: Run tests
      run: ctest --test-dir build --output-on-failure
